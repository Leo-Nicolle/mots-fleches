
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name motsflex.com;

    # Serve Vue SPA static files
    root /home/leo/motsflex/public;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;

        # HTML must be revalidated so a stale cached page never references
        # deleted hashed asset chunks after a deploy.
        add_header Cache-Control "no-cache";
        # Cross-origin isolation (needed for SharedArrayBuffer in the workers).
        # `credentialless` keeps the cross-origin Google Fonts <link> working;
        # `require-corp` would block it.
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy credentialless;
    }

    # Immutable cache for hashed build assets
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # A worker spawned from an isolated document needs its own script
        # response to carry a matching COEP header, or `new Worker()` fails.
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy credentialless;
    }

    # SEO files served as-is (not the SPA fallback)
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Proxy API requests to the Docker container
    location /api/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_max_temp_file_size 0;
        proxy_pass http://localhost:5480;
        proxy_redirect off;
        proxy_read_timeout 240s;

        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
    }

    # Proxy WebSocket collab connections to the API server
    location /collab/ {
        proxy_pass http://localhost:5480;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ /plausible/api {
        add_header X-Cache $upstream_cache_status;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_max_temp_file_size 0;
        rewrite /plausible/api/(.*) /api/$1 break;
        proxy_pass http://localhost:51000;
        proxy_redirect off;
        proxy_read_timeout 240s;
    }
    ssl_certificate /etc/letsencrypt/live/motsflex.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/motsflex.com/privkey.pem; # managed by Certbot
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.motsflex.com;
    ssl_certificate /etc/letsencrypt/live/motsflex.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/motsflex.com/privkey.pem; # managed by Certbot
    return 301 https://motsflex.com$request_uri;
}
server {
    if ($host = www.motsflex.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = motsflex.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 ;
    listen [::]:80 ;
    server_name www.motsflex.com motsflex.com;
    return 404; # managed by Certbot
}