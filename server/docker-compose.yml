services:
  db:
    image: postgres
    container_name: ${CONTAINER_NAME}-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_DATA}
      - ./db/init-scripts:/docker-entrypoint-initdb.d:ro # Updated path for init scripts
    networks:
      - internal-network # Internal network for inter-service communication
    ports:
      - ${DB_PORT}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - production
      - development
      - test

  # API service - Run only in production
  api:
    build:
      context: ./api # Path to API source
      dockerfile: Dockerfile # Use the Dockerfile in the API directory
    container_name: ${CONTAINER_NAME}-api
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      - db
    networks:
      - internal-network # Use the same internal network
    profiles:
      - production # Run only in production

  # Adminer service - Run only in development
  adminer:
    image: adminer
    container_name: ${CONTAINER_NAME}-adminer
    restart: unless-stopped
    ports:
      - ${ADMINER_PORT}:8080
    networks:
      - internal-network
    profiles:
      - development # Run only in development
      - test

networks:
  internal-network:
    driver: bridge # Default network type for isolation
