name: Deploy

on:
  push:
    branches:
      - master
      - plausible

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}
      KEY: /tmp/private-key
      DIR: motsflex
      DICOS: ~/dicos
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Setup
        run: |
          mkdir -p ~/.ssh/ && touch ~/.ssh/known_hosts
          ssh-c ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > $KEY
          chmod 600 $KEY
          echo "PUBLIC=$DIR/public" >> $GITHUB_ENV
          echo "SERVER=$DIR/server" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Dependencies
        if: ${{ success() }}
        run: npm ci

      - name: Build
        if: ${{ success() }}
        run: npm run build

      - name: Deploy
        if: ${{ success() }}
        run: |
          echo "Deploying full client"
          ssh -i $KEY $TARGET "rm -rf $PUBLIC && mkdir -p $PUBLIC"
          scp -i $KEY -r dist/public/* "$TARGET:$PUBLIC"
          ssh -i $KEY $TARGET "cp $DICOS/*.zip $PUBLIC"
          echo "Deploying server folder"
          ssh -i $KEY $TARGET "rm -rf $SERVER/api $SERVER/db && mkdir -p $SERVER"
          tar --exclude='node_modules' --exclude='dist' --exclude='.env*' --exclude='postgres-data' -czf - server | ssh -i $KEY $TARGET "tar -xzf - -C $DIR"
          echo "Refreshing API container"
          ssh -i $KEY $TARGET "cd $SERVER && docker compose --env-file .env --profile production up -d --build"
      - name: Cleanup
        run: "rm -f $KEY && rm -rf ~/.ssh"
